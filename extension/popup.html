<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Movie Voiceover Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 345px;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      font-size: 24px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .status-card {
      background: #1e293b;
      border-radius: 8px;
      padding: 9px 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      border: 1px solid #334155;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
    }
    .dot.connected {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }
    .dot.error {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 5px;
      font-weight: 500;
    }
    select, input[type="range"] {
      width: 100%;
    }
    select {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 8px 10px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 500;
      outline: none;
      cursor: pointer;
    }
    select:focus {
      border-color: #38bdf8;
    }
    .slider-val {
      font-size: 11px;
      color: #38bdf8;
      float: right;
      font-weight: 600;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 11px;
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .toggle-info {
      display: flex;
      flex-direction: column;
    }
    .toggle-title {
      font-size: 12.5px;
      font-weight: 600;
      color: #f1f5f9;
    }
    .toggle-desc {
      font-size: 10.5px;
      color: #94a3b8;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 22px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .25s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .25s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #0284c7;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    .btn-test {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 6px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
    }
    .btn-test:hover {
      opacity: 0.92;
    }
    .btn-test:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">🎬</div>
      <div>
        <div class="title">Movie Voiceover Pro</div>
        <div class="subtitle">Review Phim & Kể Chuyện AI</div>
      </div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-badge">
      <div id="statusDot" class="dot"></div>
      <span id="statusText">Đang kiểm tra server...</span>
    </div>
    <button id="btnRefresh" style="background:none; border:none; color:#38bdf8; cursor:pointer; font-size:11px; font-weight:600;">Làm mới</button>
  </div>

  <div class="toggle-row">
    <div class="toggle-info">
      <span class="toggle-title">🎙️ Bật Thuyết Minh Phim</span>
      <span class="toggle-desc">Tự động đọc phụ đề & giảm âm nền</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggleEnabled" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <div class="toggle-info">
      <span class="toggle-title">📷 Quét Sub Cứng (AI OCR)</span>
      <span class="toggle-desc">Bật khi xem web lậu in chữ chết vào hình</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggleOcr">
      <span class="slider"></span>
    </label>
  </div>

  <div class="form-group">
    <label for="selectPreset">🎭 Phong cách giọng đọc (Preset)</label>
    <select id="selectPreset">
      <option value="review_male">🔥 Review Phim Kịch Tính (Nam - Nhanh & Trầm)</option>
      <option value="review_female">✨ Review Phim Cuốn Hút (Nữ - Sắc nét)</option>
      <option value="story_male">📖 Kể Chuyện Trầm Ấm (Nam - Sâu lắng)</option>
      <option value="story_female">🌙 Kể Chuyện Đêm Khuya (Nữ - Dịu dàng)</option>
      <option value="vtv_female">📺 Thuyết Minh Truyền Hình (Nữ VTV)</option>
      <option value="vtv_male">📺 Thuyết Minh Truyền Hình (Nam VTV)</option>
    </select>
  </div>

  <div class="form-group">
    <label>
      ⚡ Tinh chỉnh tốc độ đọc thêm
      <span class="slider-val" id="rateVal">+0%</span>
    </label>
    <input type="range" id="sliderRate" min="-15" max="25" value="0" step="1">
  </div>

  <div class="form-group">
    <label>
      🎸 Tinh chỉnh độ trầm ấm (Pitch)
      <span class="slider-val" id="pitchVal">0Hz</span>
    </label>
    <input type="range" id="sliderPitch" min="-8" max="6" value="0" step="1">
  </div>

  <div class="form-group">
    <label>
      🔉 Âm lượng phim gốc khi đang đọc
      <span class="slider-val" id="duckVal">20%</span>
    </label>
    <input type="range" id="sliderDucking" min="0" max="80" value="20" step="5">
  </div>

  <button class="btn-test" id="btnTest">🔊 Nghe thử giọng Review / Kể Chuyện</button>

  <script src="popup.js"></script>
</body>
</html>
